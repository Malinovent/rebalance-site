# Only the settings this site needs. The landing page calls these without a Supabase JWT.
[functions.hit]
verify_jwt = false

[functions.waitlist]
verify_jwt = false

# Protected by the SCOREBOARD_TOKEN secret instead of a Supabase sign-in.
[functions.scoreboard]
verify_jwt = false

# Called by Paddle, not a signed-in user: protected by the Paddle-Signature check instead.
[functions.paddle-webhook]
verify_jwt = false
